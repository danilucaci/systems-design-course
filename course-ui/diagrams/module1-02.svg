<path class="edge" d="M240 64.0L310 64.0" marker-end="url(#m1-02-arrow)"/>
<path class="edge" d="M530 64.0L600 64.0" marker-end="url(#m1-02-arrow)"/>
<path class="edge" d="M710.0 108L710.0 220" marker-end="url(#m1-02-arrow)"/>
<path class="edge" d="M600 264.0L530 264.0" marker-end="url(#m1-02-arrow)"/>
<rect class="node" x="20" y="20" width="220" height="88" rx="7"/>
<text class="node-label" x="130.0" y="59.0" text-anchor="middle" style="font-size:20px">Client with</text>
<text class="node-label" x="130.0" y="83.0" text-anchor="middle" style="font-size:20px">operation key</text>
<rect class="node" x="310" y="20" width="220" height="88" rx="7"/>
<text class="node-label" x="420.0" y="59.0" text-anchor="middle" style="font-size:20px">Authenticate and</text>
<text class="node-label" x="420.0" y="83.0" text-anchor="middle" style="font-size:20px">authorize</text>
<rect class="node-primary" x="600" y="20" width="220" height="88" rx="7"/>
<text class="node-primary-label" x="710.0" y="59.0" text-anchor="middle" style="font-size:20px">Database</text>
<text class="node-primary-label" x="710.0" y="83.0" text-anchor="middle" style="font-size:20px">transaction</text>
<rect class="node" x="600" y="220" width="220" height="88" rx="7"/>
<text class="node-label" x="710.0" y="259.0" text-anchor="middle" style="font-size:20px">Journey and</text>
<text class="node-label" x="710.0" y="283.0" text-anchor="middle" style="font-size:20px">response snapshot</text>
<rect class="node" x="310" y="220" width="220" height="88" rx="7"/>
<text class="node-label" x="420.0" y="259.0" text-anchor="middle" style="font-size:20px">Commit before</text>
<text class="node-label" x="420.0" y="283.0" text-anchor="middle" style="font-size:20px">response</text>
</svg>
