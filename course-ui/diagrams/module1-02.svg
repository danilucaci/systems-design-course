<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 340" role="img" aria-labelledby="m1-02-title m1-02-desc">
<title id="m1-02-title">API design</title><desc id="m1-02-desc">Client with operation key leads to Authenticate and authorize. Authenticate and authorize leads to Database transaction. Database transaction leads to Journey and response snapshot. Journey and response snapshot leads to Commit before response.</desc>
