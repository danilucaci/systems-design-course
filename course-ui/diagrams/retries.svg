<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 530" role="img" aria-labelledby="retries-title retries-desc">
  <title id="retries-title">Recovering a save after its response is lost</title>
  <desc id="retries-desc">The browser saves a journey using operation key K. The API atomically persists the journey and operation result, and the database acknowledges commit. The success response is lost. The browser retries the same key. The API reads the committed result for that caller and key, receives the existing journey identifier, and returns the original outcome.</desc>
  <defs><marker id="retries-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path class="arrow-head" d="M0 0 10 5 0 10z"/></marker></defs>
  <rect class="node" x="50" y="20" width="160" height="52" rx="7"/><text class="node-label" x="130" y="52" text-anchor="middle">Browser</text>
  <rect class="node-primary" x="320" y="20" width="160" height="52" rx="7"/><text class="node-primary-label" x="400" y="52" text-anchor="middle">API</text>
  <rect class="node" x="590" y="20" width="160" height="52" rx="7"/><text class="node-label" x="670" y="52" text-anchor="middle">Database</text>
  <path class="lifeline" d="M130 72V510M400 72V510M670 72V510"/>
  <path class="edge" d="M130 117H400" marker-end="url(#retries-arrow)"/><text class="edge-label" x="265" y="106" text-anchor="middle">Save journey · operation key K</text>
  <path class="edge" d="M400 171H670" marker-end="url(#retries-arrow)"/><text class="edge-label" x="535" y="147" text-anchor="middle">Atomically persist journey</text><text class="edge-label" x="535" y="161" text-anchor="middle">and result for K</text>
  <path class="edge" d="M670 221H400" marker-end="url(#retries-arrow)" style="stroke-dasharray:4 3"/><text class="edge-label" x="535" y="209" text-anchor="middle">Commit acknowledged</text>
  <path class="lost" d="M400 273H137M123 266L137 280M137 266L123 280"/><text class="lost-label" x="265" y="260" text-anchor="middle">Success response lost</text>
  <path class="edge" d="M130 325H400" marker-end="url(#retries-arrow)"/><text class="edge-label" x="265" y="313" text-anchor="middle">Retry the same operation key K</text>
  <path class="edge" d="M400 377H670" marker-end="url(#retries-arrow)"/><text class="edge-label" x="535" y="365" text-anchor="middle">Read result for caller + K</text>
  <path class="edge" d="M670 429H400" marker-end="url(#retries-arrow)" style="stroke-dasharray:4 3"/><text class="edge-label" x="535" y="417" text-anchor="middle">Existing journey identifier</text>
  <path class="edge" d="M400 481H130" marker-end="url(#retries-arrow)" style="stroke-dasharray:4 3"/><text class="edge-label" x="265" y="469" text-anchor="middle">Return the original outcome</text>
</svg>
