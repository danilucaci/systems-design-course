<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 340" role="img" aria-labelledby="m1-05-title m1-05-desc">
<title id="m1-05-title">Sharding</title><desc id="m1-05-desc">Current owner and epoch leads to Freeze and drain bucket. Freeze and drain bucket leads to Copy and verify state. Copy and verify state leads to Publish next owner epoch. Publish next owner epoch leads to Reject stale routes.</desc>
<defs><marker id="m1-05-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path class="arrow-head" d="M0 0 10 5 0 10z"/></marker></defs>
<path class="edge" d="M240 64.0L310 64.0" marker-end="url(#m1-05-arrow)"/>
<path class="edge" d="M530 64.0L600 64.0" marker-end="url(#m1-05-arrow)"/>
<path class="edge" d="M710.0 108L710.0 220" marker-end="url(#m1-05-arrow)"/>
<path class="edge" d="M600 264.0L530 264.0" marker-end="url(#m1-05-arrow)"/>
<rect class="node" x="20" y="20" width="220" height="88" rx="7"/>
<text class="node-label" x="130.0" y="59.0" text-anchor="middle" style="font-size:20px">Current owner and</text>
<text class="node-label" x="130.0" y="83.0" text-anchor="middle" style="font-size:20px">epoch</text>
<rect class="node" x="310" y="20" width="220" height="88" rx="7"/>
<text class="node-label" x="420.0" y="59.0" text-anchor="middle" style="font-size:20px">Freeze and drain</text>
<text class="node-label" x="420.0" y="83.0" text-anchor="middle" style="font-size:20px">bucket</text>
<rect class="node-primary" x="600" y="20" width="220" height="88" rx="7"/>
<text class="node-primary-label" x="710.0" y="59.0" text-anchor="middle" style="font-size:20px">Copy and verify</text>
<text class="node-primary-label" x="710.0" y="83.0" text-anchor="middle" style="font-size:20px">state</text>
<rect class="node" x="600" y="220" width="220" height="88" rx="7"/>
<text class="node-label" x="710.0" y="259.0" text-anchor="middle" style="font-size:20px">Publish next owner</text>
<text class="node-label" x="710.0" y="283.0" text-anchor="middle" style="font-size:20px">epoch</text>
<rect class="node" x="310" y="220" width="220" height="88" rx="7"/>
<text class="node-label" x="420.0" y="271.0" text-anchor="middle" style="font-size:20px">Reject stale routes</text>
</svg>
